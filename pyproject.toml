[project]
name = "thedas-io"
version = "0.1.0"
description = "Blender 5.2 extension importing and exporting Dragon Age: Origins .msh meshes and .mmh hierarchies"
readme = "README.md"
authors = [
    { name = "Reyuu", email = "7038406+Reyuu@users.noreply.github.com" }
]
requires-python = ">=3.11"
# runtime deps of the extension. pytest/ruff are dev tools and live in the
# dev group; the Blender install gets its own copies via the manifest wheels
dependencies = [
    "pillow",
    "pynvtt>=0.0.2",
    "numpy>=2.4.6",
    # Blowfish, for the encrypted .erf/.rim archives the DLC modules ship in
    "pycryptodome>=3.23",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.9",
    "fake-bpy-module>=20260925",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: spawns a real `blender --background`; deselect with -m 'not blender'",
    "corpus: walks a real game install; set THEDAS_MSH_CORPUS to enable",
]

[tool.coverage.run]
# the tests live in tests/, the add-on in src/; blender-backed cases are opt-in
source = ["src"]
omit = ["src/thedas_io/asset_db/data/*"]

[tool.coverage.report]
skip_covered = true
# baseline measured with `uv run pytest -m "not blender" --cov=src`; ratchet up
# as the Blender-only paths gain unit coverage
fail_under = 65
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src", "tests", "tools"]
python_version = "3.13"
# nvtt ships no py.typed; typed deps (numpy, Pillow) still checked normally
disable_error_code = ["import-untyped"]
# bpy-stubs (via fake-bpy-module) use PEP 695 syntax
# mypy needs a 3.13+
[[tool.mypy.overrides]]
module = ["bpy.*", "bpy", "mathutils.*", "mathutils"]
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.datablocks",
    "thedas_io.fsio",
    "thedas_io.tnt",
    "thedas_io.textures",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.geometry",
    "thedas_io.materials",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.ani.operators",
    "thedas_io.builders",
    "thedas_io.exporters",
    "thedas_io.importers",
    "thedas_io.phy.operators",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.asset_browser",
    "thedas_io.blender_materials",
    "thedas_io.export_registry",
    "thedas_io.panels",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.assets",
    "thedas_io.ui",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.asset_db.scanner",
    "thedas_io.substance",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.ani.description",
    "thedas_io.ani.export",
    "thedas_io.ani.scene",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "thedas_io.erf.description",
    "thedas_io.gff40.description",
]
disallow_untyped_defs = true
